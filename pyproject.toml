[project]
name = "randompasswordgenerator"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Filip Wojtczak", email = "wojtczakkf@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "cryptography>=50.0.2",
    "pyperclip>=1.11.0",
    "ruff>=0.17.4",
]

[project.scripts]
randompasswordgenerator = "randompasswordgenerator:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
